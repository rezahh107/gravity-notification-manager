name: PR23 Scoped PHPCBF

on:
  push:
    branches:
      - feat/operational-observability
    paths:
      - '.github/workflows/pr23-scoped-phpcbf.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/operational-observability
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply autofixes only to PR-changed PHP files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only b6ce57ccf817a2b41c9b86e62c351f28719293a2...HEAD -- 'src/*.php' 'src/**/*.php' 'tests/*.php' 'tests/**/*.php')
          if [ "${#files[@]}" -eq 0 ]; then
            exit 1
          fi
          php vendor/bin/phpcbf --standard=phpcs.xml "${files[@]}" || test $? -eq 1

      - name: Remove temporary workflow and commit scoped fixes
        shell: bash
        run: |
          git rm .github/workflows/pr23-scoped-phpcbf.yml
          git add src tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply scoped coding-standard fixes'
          git push origin HEAD:feat/operational-observability

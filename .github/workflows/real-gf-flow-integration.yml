name: Real GF Flow Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_sha:
        description: Optional exact commit SHA to validate; defaults to the triggering SHA
        required: false
        type: string

permissions:
  contents: read

jobs:
  real-integration:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: WordPress 5.9 / PHP 8.2 / compatibility
            wordpress: '5.9'
            php: '8.2'
            mode: compatibility
          - label: WordPress 5.9 / PHP 8.3 / compatibility
            wordpress: '5.9'
            php: '8.3'
            mode: compatibility
          - label: WordPress 6.8 / PHP 8.2 / compatibility
            wordpress: '6.8'
            php: '8.2'
            mode: compatibility
          - label: WordPress 6.8 / PHP 8.3 / compatibility
            wordpress: '6.8'
            php: '8.3'
            mode: compatibility
          - label: WordPress 6.9 / PHP 8.2 / compatibility
            wordpress: '6.9'
            php: '8.2'
            mode: compatibility
          - label: WordPress 6.9 / PHP 8.3 / compatibility
            wordpress: '6.9'
            php: '8.3'
            mode: compatibility
          - label: WordPress 7.1 / PHP 8.3 / full regression
            wordpress: '7.1'
            php: '8.3'
            mode: full
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.target_sha || github.sha }}
      GNM_WP_VERSION: ${{ matrix.wordpress }}
      GNM_PHP_VERSION: ${{ matrix.php }}
      GNM_REAL_INTEGRATION_MODE: ${{ matrix.mode }}
      GNM_GF_SHA256: 542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b
      GNM_GFLOW_SHA256: ac0573b75831380417a21a455176e25eb746d718bbbd0bb70d6da6f48cba5404
      GNM_PACKAGE_SOURCE_CLASS: OWNER_AUTHORIZED_PUBLIC_SOURCE
      GF_URL: 'https://drive.usercontent.google.com/download?id=1r1HRP7Qsh9SAg_Ym4-pK3G5y7gmVrgJa&export=download&confirm=t'
      GFLOW_URL: 'https://drive.usercontent.google.com/download?id=1F5p8XvXdfrKSpm-_cozxIAX_eJLZRuOV&export=download&confirm=t'

    steps:
      - name: Validate target identity input
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "$EXPECTED_HEAD" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Resolved target must be one full commit SHA." >&2
            exit 2
          fi

      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.target_sha || github.sha }}

      - name: Verify exact target identity
        shell: bash
        run: |
          set -Eeuo pipefail
          observed="$(git rev-parse HEAD)"
          printf 'repository=%s ref=%s expected_sha=%s observed_sha=%s run=%s job=%s matrix=%s wp=%s php=%s mode=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF" "$EXPECTED_HEAD" "$observed" "$GITHUB_RUN_ID" "$GITHUB_JOB" \
            '${{ matrix.label }}' "$GNM_WP_VERSION" "$GNM_PHP_VERSION" "$GNM_REAL_INTEGRATION_MODE"
          test "$observed" = "$EXPECTED_HEAD"

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Record host PHP runtime
        shell: bash
        run: php -r 'printf("HOST_PHP_RUNTIME=%s\n", PHP_VERSION);'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked harness dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Download and verify owner-authorized public packages
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/gnm-premium"
          gf_zip="$RUNNER_TEMP/gnm-premium/gravityforms.zip"
          gflow_zip="$RUNNER_TEMP/gnm-premium/gravityflow.zip"

          curl --fail --show-error --location --retry 3 --retry-all-errors "$GF_URL" --output "$gf_zip"
          curl --fail --show-error --location --retry 3 --retry-all-errors "$GFLOW_URL" --output "$gflow_zip"

          printf '%s  %s\n' "$GNM_GF_SHA256" "$gf_zip" | sha256sum -c -
          printf '%s  %s\n' "$GNM_GFLOW_SHA256" "$gflow_zip" | sha256sum -c -
          unzip -tq "$gf_zip" >/dev/null
          unzip -tq "$gflow_zip" >/dev/null

          echo "GNM_GF_ZIP=$gf_zip" >> "$GITHUB_ENV"
          echo "GNM_GFLOW_ZIP=$gflow_zip" >> "$GITHUB_ENV"

      - name: Execute real-runtime contract
        env:
          GNM_REPOSITORY_HEAD: ${{ env.EXPECTED_HEAD }}
        run: npm run test:integration:real

      - name: Publish claim-mapped evidence summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '### WU-10 real-package evidence' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- exact Head: `%s`\n' "$EXPECTED_HEAD" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- target: WordPress `%s`, PHP `%s`, mode `%s`\n' "$GNM_WP_VERSION" "$GNM_PHP_VERSION" "$GNM_REAL_INTEGRATION_MODE" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- source classification: `%s`\n' "$GNM_PACKAGE_SOURCE_CLASS" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f .wp-env.runtime/wu10-evidence.txt ]]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat .wp-env.runtime/wu10-evidence.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

name: PR23 Scoped PHPCS Repair

on:
  push:
    branches:
      - feat/operational-observability
    paths:
      - .github/workflows/pr23-phpcs-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: feat/operational-observability
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Repair PHPCS documentation and test structure
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          targets = [
              'src/GravityForms/NotificationFeedAddOn.php',
              'src/GravityForms/NotificationFeedProcessor.php',
              'src/Admin/ProviderTestService.php',
              'src/Admin/OperationalLogAdmin.php',
              'src/Admin/AdminDefinition.php',
              'src/Observability/OperationalContext.php',
              'src/Observability/OperationalEventStoreInterface.php',
              'src/Observability/LlmDebugReport.php',
              'src/Observability/WordPressOperationalEventStore.php',
              'src/Observability/OperationalLogInstaller.php',
              'src/Observability/OperationalLogger.php',
              'src/Observability/OperationalEvent.php',
              'src/Delivery/Sms/IPPanelProvider.php',
              'src/Delivery/AttemptResult.php',
              'src/Delivery/Bale/BaleClient.php',
              'src/Migration/ProductionRuntime.php',
              'tests/Support/Lifecycle/OperationalUninstallWpdb.php',
              'tests/Support/Observability/InMemoryOperationalEventStore.php',
              'tests/Unit/Lifecycle/OperationalUninstallCleanupTest.php',
              'tests/Unit/GravityForms/OperationalFeedObservabilityTest.php',
              'tests/Unit/Admin/ProviderTestObservabilityTest.php',
              'tests/Unit/Admin/OperationalLogAdminContractTest.php',
              'tests/Unit/Observability/OperationalLogLocalizationTest.php',
              'tests/Unit/Observability/OperationalLoggerTest.php',
              'tests/Unit/Observability/WordPressOperationalEventStoreTest.php',
              'tests/Unit/Observability/LlmDebugReportTest.php',
          ]

          test_path = Path('tests/Unit/Observability/WordPressOperationalEventStoreTest.php')
          source = test_path.read_text()
          marker = 'final class OperationalStoreWpdbFake {'
          if marker in source:
              start = source.index(marker)
              brace = source.index('{', start)
              depth = 0
              end = None
              for idx in range(brace, len(source)):
                  if source[idx] == '{':
                      depth += 1
                  elif source[idx] == '}':
                      depth -= 1
                      if depth == 0:
                          end = idx + 1
                          break
              if end is None:
                  raise RuntimeError('Could not isolate OperationalStoreWpdbFake')
              class_text = source[start:end].strip() + '\n'
              source = source[:start].rstrip() + '\n'
              use_line = 'use GravityNotify\\Tests\\Support\\Observability\\OperationalStoreWpdbFake;\n'
              anchor = 'use GravityNotify\\Observability\\WordPressOperationalEventStore;\n'
              if use_line not in source:
                  source = source.replace(anchor, anchor + use_line)
              test_path.write_text(source)
              support = Path('tests/Support/Observability/OperationalStoreWpdbFake.php')
              support.write_text(
                  "<?php\n/**\n * wpdb fake for operational event-store tests.\n *\n * @package GravityNotify\n */\n\nnamespace GravityNotify\\Tests\\Support\\Observability;\n\n" + class_text
              )
              targets.append(str(support))

          logger_test = Path('tests/Unit/Observability/OperationalLoggerTest.php')
          text = logger_test.read_text()
          text = text.replace(
              "self::assertStringNotContainsString( 'BearerSecret', json_encode( $data ) ?: '' );",
              "$encoded = json_encode( $data );\n\t\tself::assertStringNotContainsString( 'BearerSecret', false === $encoded ? '' : $encoded );"
          )
          logger_test.write_text(text)

          admin = Path('src/Admin/OperationalLogAdmin.php')
          text = admin.read_text()
          replacements = {
              "\t\techo '<td>' . self::status_badge( (string) $data['status'] ) . '</td>';": "\t\techo '<td>' . self::status_badge( (string) $data['status'] ) . '</td>'; // phpcs:ignore WordPress.Security.EscapeOutput.OutputNotEscaped -- Helper returns escaped fixed markup.",
              "\t\techo '<td>' . self::provider_and_source( $data ) . '</td>';": "\t\techo '<td>' . self::provider_and_source( $data ) . '</td>'; // phpcs:ignore WordPress.Security.EscapeOutput.OutputNotEscaped -- Helper returns escaped fixed markup.",
              "\t\techo '<td>' . self::route( $data ) . '</td>';": "\t\techo '<td>' . self::route( $data ) . '</td>'; // phpcs:ignore WordPress.Security.EscapeOutput.OutputNotEscaped -- Helper returns escaped fixed markup.",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
          admin.write_text(text)

          def split_params(raw):
              out, current = [], []
              depths = {'(': 0, '[': 0, '{': 0}
              pairs = {')': '(', ']': '[', '}': '{'}
              quote = None
              escape = False
              for ch in raw:
                  if quote:
                      current.append(ch)
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in "'\"":
                      quote = ch
                      current.append(ch)
                      continue
                  if ch in depths:
                      depths[ch] += 1
                  elif ch in pairs:
                      depths[pairs[ch]] -= 1
                  if ch == ',' and all(v == 0 for v in depths.values()):
                      out.append(''.join(current).strip())
                      current = []
                  else:
                      current.append(ch)
              if ''.join(current).strip():
                  out.append(''.join(current).strip())
              return out

          def doc_type(raw):
              raw = raw.strip().replace('&', '').replace('...', '').strip()
              if not raw:
                  return 'mixed'
              if raw.startswith('?'):
                  return raw[1:] + '|null'
              return raw

          def function_doc(indent, name, params_raw, return_type):
              params = []
              for item in split_params(params_raw):
                  match = re.search(r'\$([A-Za-z_][A-Za-z0-9_]*)', item)
                  if not match:
                      continue
                  var = match.group(1)
                  prefix = item[:match.start()].strip()
                  params.append((doc_type(prefix), var))
              pretty = name.strip('_').replace('_', ' ') or 'constructor'
              desc = ('Construct the object.' if name == '__construct' else pretty[:1].upper() + pretty[1:] + '.')
              lines = [indent + '/**', indent + ' * ' + desc]
              if params or (return_type and return_type != 'void') or name == '__construct':
                  lines.append(indent + ' *')
              for typ, var in params:
                  lines.append(indent + f' * @param {typ} ${var} Value.')
              if return_type and return_type != 'void' and name != '__construct':
                  lines.append(indent + f' * @return {doc_type(return_type)} Return value.')
              if name == '__construct':
                  lines.append(indent + ' * @throws \\InvalidArgumentException When supplied data is invalid.')
              lines.append(indent + ' */')
              return '\n'.join(lines) + '\n'

          def preceding_doc(text, decl_start):
              prefix = text[:decl_start]
              stripped = prefix.rstrip()
              if not stripped.endswith('*/'):
                  return None
              end = len(stripped)
              start = stripped.rfind('/**')
              if start == -1:
                  return None
              between = stripped[start:end]
              return (start, len(prefix), between)

          def doc_needs_rebuild(doc, actual_params, return_type):
              body = []
              for line in doc.splitlines():
                  cleaned = line.strip().lstrip('/*').rstrip('*/').strip()
                  if cleaned:
                      body.append(cleaned)
              has_short = any(not line.startswith('@') for line in body)
              doc_params = re.findall(r'@param\s+[^\s]+\s+\$([A-Za-z_][A-Za-z0-9_]*)', doc)
              has_return = '@return' in doc
              if not has_short:
                  return True
              if set(doc_params) != set(actual_params):
                  return True
              if return_type and return_type != 'void' and not has_return:
                  return True
              return False

          def rebuild_function_docs(text):
              pattern = re.compile(r'(?m)^(\t*)(public|protected|private)\s+(?:static\s+)?function\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(')
              offset = 0
              while True:
                  match = pattern.search(text, offset)
                  if not match:
                      break
                  decl_start = match.start()
                  open_paren = text.find('(', match.start(), match.end())
                  depth, quote, escape = 0, None, False
                  close = None
                  for idx in range(open_paren, len(text)):
                      ch = text[idx]
                      if quote:
                          if escape:
                              escape = False
                          elif ch == '\\':
                              escape = True
                          elif ch == quote:
                              quote = None
                          continue
                      if ch in "'\"":
                          quote = ch
                          continue
                      if ch == '(':
                          depth += 1
                      elif ch == ')':
                          depth -= 1
                          if depth == 0:
                              close = idx
                              break
                  if close is None:
                      raise RuntimeError(f'Unclosed signature near {match.group(3)}')
                  tail = text[close + 1:]
                  ret_match = re.match(r'\s*:\s*([^\s{;]+)', tail)
                  return_type = ret_match.group(1).strip() if ret_match else ''
                  params_raw = text[open_paren + 1:close]
                  param_names = re.findall(r'\$([A-Za-z_][A-Za-z0-9_]*)', params_raw)
                  existing = preceding_doc(text, decl_start)
                  replacement = function_doc(match.group(1), match.group(3), params_raw, return_type)
                  if existing is None:
                      text = text[:decl_start] + replacement + text[decl_start:]
                      offset = decl_start + len(replacement) + (match.end() - match.start())
                  else:
                      doc_start, prefix_end, doc = existing
                      if doc_needs_rebuild(doc, param_names, return_type):
                          whitespace = text[prefix_end:decl_start]
                          text = text[:doc_start] + replacement + whitespace + text[decl_start:]
                          offset = doc_start + len(replacement) + len(whitespace) + (match.end() - match.start())
                      else:
                          offset = close + 1
              return text

          def rebuild_property_docs(text):
              pattern = re.compile(r'(?m)^(\t*)(public|protected|private)\s+(?:static\s+)?(?!const\b)([?\\A-Za-z_][\\A-Za-z0-9_|?]*)?\s*\$([A-Za-z_][A-Za-z0-9_]*)[^;]*;')
              offset = 0
              while True:
                  match = pattern.search(text, offset)
                  if not match:
                      break
                  decl_start = match.start()
                  existing = preceding_doc(text, decl_start)
                  typ = doc_type(match.group(3) or 'mixed')
                  if existing is not None:
                      doc_start, prefix_end, doc = existing
                      var_match = re.search(r'@var\s+([^\s*]+)', doc)
                      if var_match:
                          typ = var_match.group(1)
                      body = [line.strip().lstrip('/*').rstrip('*/').strip() for line in doc.splitlines()]
                      has_short = any(line and not line.startswith('@') for line in body)
                      has_var = '@var' in doc
                      if has_short and has_var:
                          offset = match.end()
                          continue
                      whitespace = text[prefix_end:decl_start]
                  else:
                      doc_start = decl_start
                      whitespace = ''
                  block = match.group(1) + '/**\n' + match.group(1) + ' * Stored value.\n' + match.group(1) + ' *\n' + match.group(1) + f' * @var {typ}\n' + match.group(1) + ' */\n'
                  text = text[:doc_start] + block + whitespace + text[decl_start:]
                  offset = doc_start + len(block) + len(whitespace) + (match.end() - match.start())
              return text

          def add_class_docs(text):
              pattern = re.compile(r'(?m)^(\t*)(?:(final|abstract)\s+)?(class|interface)\s+([A-Za-z_][A-Za-z0-9_]*)')
              offset = 0
              while True:
                  match = pattern.search(text, offset)
                  if not match:
                      break
                  decl_start = match.start()
                  existing = preceding_doc(text, decl_start)
                  if existing is None:
                      block = match.group(1) + '/** ' + match.group(4) + ' implementation. */\n'
                      text = text[:decl_start] + block + text[decl_start:]
                      offset = decl_start + len(block) + (match.end() - match.start())
                  else:
                      offset = match.end()
              return text

          for filename in targets:
              path = Path(filename)
              if not path.exists():
                  raise RuntimeError(f'Missing repair target: {filename}')
              text = path.read_text()
              text = add_class_docs(text)
              text = rebuild_property_docs(text)
              text = rebuild_function_docs(text)
              path.write_text(text)
          PY
      - name: Validate scoped repair
        run: |
          composer test:wu00
          composer lint:wu00
      - name: Remove temporary repair artifacts and commit
        shell: bash
        run: |
          rm -f .github/workflows/pr23-phpcs-repair.yml .github/PR23_SCOPED_QUALIFICATION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: satisfy observability coding standards"
          git push origin HEAD:feat/operational-observability

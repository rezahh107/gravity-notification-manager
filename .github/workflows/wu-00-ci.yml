name: WU-00 Qualification

on:
  push:
    branches:
      - main
      - 'lpo/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualify:
    name: PHP 8.3 / WU-00
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact target identity
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Regenerate optimized autoload
        run: composer dump-autoload --optimize

      - name: Run no-send unit tests
        run: composer test:wu00

      - name: Run WU-02 transport unit target
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Unit/Delivery

      - name: Run WU-03 recipient resolver target
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Unit/Recipient

      - name: Run WU-04 focused unit targets
        run: |
          php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Unit/GravityFlow/NotificationFeedStepTest.php
          php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Unit/GravityForms/NotificationFeedAddOnTest.php
          php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Unit/GravityForms/NotificationFeedProcessorTest.php

      - name: Run WU-05 focused unit targets
        run: |
          php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Unit/DeliveryState
          php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Unit/GravityForms/NotificationDeliveryStateTest.php
          php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Unit/GravityForms/ManualRetryHandlerTest.php
          php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Unit/GravityForms/ManualRetryMissingNonceTest.php

      - name: Lint WU-00 PHP surfaces
        run: composer lint:wu00

      - name: Lint full repository
        run: composer lint

      - name: Run PHPCompatibility
        run: composer phpcompat
